<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <defs>
    <linearGradient id="bgArchPtp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#010206"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#bgArchPtp)"/>

  <text x="500" y="45" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="20" text-anchor="middle">
    PTP Architecture: Software Timing Jitter vs Zero-Trust Boundary Clock Pipeline
  </text>

  <!-- Left: Vulnerable Architecture -->
  <rect x="40" y="80" width="430" height="380" rx="10" fill="#14060c" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="55" y="95" width="400" height="34" rx="6" fill="#ef4444" fill-opacity="0.2"/>
  <text x="255" y="118" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
    Hazardous: Software Jitter &amp; Rogue BMCA
  </text>

  <rect x="55" y="145" width="400" height="60" rx="6" fill="#02040a" stroke="#242f5d"/>
  <text x="70" y="170" fill="#fca5a5" font-family="monospace" font-size="11">Software Kernel Timestamping &bull; Uncalibrated Asymmetry</text>
  <text x="70" y="190" fill="#ef4444" font-family="-apple-system, sans-serif" font-size="11">Unconstrained BMCA &bull; Single GM &bull; Non-PTP Transit Switches</text>

  <rect x="55" y="220" width="400" height="220" rx="6" fill="#1c0710" stroke="#ef4444" stroke-opacity="0.4"/>
  <text x="70" y="245" fill="#f87171" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">CRITICAL PRECISION TIMING RISKS:</text>
  <text x="70" y="275" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; OS kernel queue delays introduce 5–50us random jitter, violating MaxTE</text>
  <text x="70" y="305" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Uncalibrated Tx/Rx fiber length difference causes permanent phase error</text>
  <text x="70" y="335" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Rogue untrusted master injects Announce frame, hijacking trading engine clock</text>
  <text x="70" y="365" fill="#fca5a5" font-family="-apple-system, sans-serif" font-size="11">&bull; Non-PTP queueing switches corrupt packet delay variation (PDV)</text>
  <text x="70" y="415" fill="#ef4444" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">TDD FRAME COLLISION &bull; MiFID II NON-COMPLIANCE &bull; BMCA HIJACK</text>

  <!-- Right: Hardened Zero-Trust Architecture -->
  <rect x="530" y="80" width="430" height="380" rx="10" fill="#041a12" stroke="#10b981" stroke-width="1.5"/>
  <rect x="545" y="95" width="400" height="34" rx="6" fill="#10b981" fill-opacity="0.2"/>
  <text x="745" y="118" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="14" text-anchor="middle">
    Hardened: PTPForge Zero-Trust
  </text>

  <rect x="545" y="145" width="400" height="60" rx="6" fill="#02040a" stroke="#1e293b"/>
  <text x="560" y="170" fill="#34d399" font-family="monospace" font-size="11">PHY/MAC Hardware Timestamps &bull; Asymmetry Calibrated</text>
  <text x="560" y="190" fill="#38bdf8" font-family="monospace" font-size="11">Boundary Clock &bull; BMCA Role Lock &bull; Dual PRTC GNSS</text>

  <rect x="545" y="220" width="400" height="220" rx="6" fill="#062e22" stroke="#10b981" stroke-opacity="0.4"/>
  <text x="560" y="245" fill="#34d399" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">5G &amp; FINANCIAL TRADING GUARANTEES:</text>
  <text x="560" y="275" fill="#d1fae5" font-family="-apple-system, sans-serif" font-size="11">&bull; Hardware PHY/MAC timestamping guarantees deterministic sub-nanosecond accuracy</text>
  <text x="560" y="305" fill="#d1fae5" font-family="-apple-system, sans-serif" font-size="11">&bull; Fiber asymmetry compensation eliminates static delay error from fiber runs</text>
  <text x="560" y="335" fill="#d1fae5" font-family="-apple-system, sans-serif" font-size="11">&bull; Port role locking (master-only / not-slave) completely stops rogue GM injection</text>
  <text x="560" y="365" fill="#d1fae5" font-family="-apple-system, sans-serif" font-size="11">&bull; Boundary Clock terminates PDV at every hop, guaranteeing 5G MaxTE &lt; 1.5us</text>
  <text x="560" y="415" fill="#10b981" font-family="-apple-system, sans-serif" font-weight="700" font-size="12">IEEE 1588-2019 &bull; ITU-T G.8275.1 &bull; ARISTA, CISCO, JUNIPER &amp; LINUX</text>
</svg>
